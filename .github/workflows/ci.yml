name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Dependency gates (software standard v1.0)
        run: |
          cargo install --locked cargo-deny cargo-audit
          cargo deny --locked check
          cargo audit
      - name: End-to-end
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install pymavlink
          cargo build --locked --bins --examples
          PYTHON="$RUNNER_TEMP/venv/bin/python" scripts/e2e.sh
      - name: Link end-to-end
        run: PYTHON="$RUNNER_TEMP/venv/bin/python" scripts/link-e2e.sh

  # The link through oasa-lab's simulated channel, with the lab's independent evidence checker.
  lab:
    name: oasa-lab l1-oasa-link
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: joinoasa/oasa-lab
          ref: main
          path: oasa-lab
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build
        run: cargo build --locked --bins
      - name: Run the lab suite
        working-directory: oasa-lab
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/lab"
          "$RUNNER_TEMP/lab/bin/pip" install -e .
          OASA_SEC_BIN_DIR="$GITHUB_WORKSPACE/target/debug" "$RUNNER_TEMP/lab/bin/oasa-lab" run l1-oasa-link --out runs
      - name: Show the summary
        if: always()
        run: cat oasa-lab/runs/*/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: l1-oasa-link-evidence
          path: oasa-lab/runs/
          if-no-files-found: error
