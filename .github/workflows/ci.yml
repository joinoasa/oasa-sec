name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Dependency gates (software standard v1.0)
        run: |
          cargo install --locked cargo-deny cargo-audit
          cargo deny --locked check
          cargo audit
      - name: End-to-end
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install pymavlink
          cargo build --locked --bins --examples
          PYTHON="$RUNNER_TEMP/venv/bin/python" scripts/e2e.sh
      - name: Link end-to-end
        run: scripts/link-e2e.sh
