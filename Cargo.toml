[package]
name = "oasa-sec"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "OASA-SEC v0 prototype: device identity, encrypted pairing, MAVLink signing keys (R-SEC1) and the encrypted link (R-COM2)"
repository = "https://github.com/joinoasa/oasa-sec"
publish = false

[dependencies]
snow = { version = "0.10", default-features = false, features = ["default-resolver-crypto", "std"] }
mavlink = { version = "0.20", default-features = false, features = ["std", "dialect-common", "transport-tcp", "transport-udp", "mav2-message-signing"] }
curve25519-dalek = { version = "5.0", default-features = false, features = ["zeroize"] }
blake2 = "0.11"
getrandom = "0.4"
zeroize = { version = "1", features = ["derive"] }
data-encoding = "2"
qrcode = { version = "0.14", default-features = false }

[[bin]]
name = "oasa-pair"
path = "src/bin/oasa-pair.rs"

[[bin]]
name = "oasa-link"
path = "src/bin/oasa-link.rs"

# Crypto crates are far too slow unoptimized for the handshake-heavy tests.
[profile.dev.package."*"]
opt-level = 2
